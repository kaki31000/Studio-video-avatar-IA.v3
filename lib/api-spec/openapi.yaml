openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: studio
    description: Avatar video generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /studio/status:
    get:
      operationId: getStudioStatus
      tags: [studio]
      summary: Check the avatar video engine
      responses:
        "200":
          description: Engine availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioStatus"
  /studio/generate:
    post:
      operationId: generateAvatarVideo
      tags: [studio]
      summary: Start a multi-scene avatar video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarVideoInput"
      responses:
        "202":
          description: Generation task accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarVideoCreated"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Video engine is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Video engine returned an invalid response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /studio/tasks/{taskId}:
    get:
      operationId: getAvatarVideoTask
      tags: [studio]
      summary: Get generation progress
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: Task status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarVideoTask"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid task identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Unable to read task status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Video engine is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /studio/tasks/{taskId}/stop:
    post:
      operationId: stopAvatarVideoTask
      tags: [studio]
      summary: Stop a running generation task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: Stop request result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarVideoStopped"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid task identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Task is no longer running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Video engine is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /studio/tasks/{taskId}/video:
    get:
      operationId: getAvatarVideoFile
      tags: [studio]
      summary: Download a completed avatar video
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: Generated MP4 video
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "206":
          description: Partial MP4 response for video playback
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: Video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid task identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Unable to retrieve video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Video engine is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StudioStatus:
      type: object
      properties:
        configured:
          type: boolean
        engine:
          type: string
          enum: [agnes]
        message:
          type: string
      required: [configured, engine, message]
    AvatarVideoInput:
      type: object
      properties:
        avatarImageDataUrl:
          type: string
          minLength: 1
          maxLength: 12000000
          description: Resized PNG, JPEG, or WebP image encoded as a data URL
        sceneImageDataUrls:
          type: array
          maxItems: 2
          items:
            type: string
            minLength: 1
            maxLength: 12000000
          description: Optional additional photos used as visual scene references
        agnesApiKey:
          type: string
          minLength: 1
          maxLength: 512
          writeOnly: true
          description: Optional Agnes API key used only for this render and never persisted
        scriptText:
          type: string
          minLength: 1
          maxLength: 16000
        sceneDirection:
          type: string
          maxLength: 1800
        format:
          type: string
          enum: ["16:9", "9:16", "1:1"]
        audioSource:
          type: string
          enum: [post_stitch]
          default: post_stitch
          description: Audio is always generated after the silent Agnes video with the dedicated TTS provider
        audioVoice:
          type: string
          enum: [mascot-auto]
          default: mascot-auto
          description: Automatically designed French ElevenLabs voice matched to the mascot
        mascotVoiceDirection:
          type: string
          maxLength: 800
          description: Optional personality and delivery direction for the mascot voice
        videoDuration:
          type: integer
          enum: [15, 30, 45, 60]
          default: 15
          description: Requested final video duration in seconds
        sceneCount:
          type: integer
          enum: [1, 2, 3]
          default: 1
          description: Number of distinct video plans to generate
      required: [avatarImageDataUrl, scriptText, format, audioSource, audioVoice]
    AvatarVideoCreated:
      type: object
      properties:
        taskId:
          type: string
        accepted:
          type: boolean
      required: [taskId, accepted]
    AvatarVideoStopped:
      type: object
      properties:
        taskId:
          type: string
        stopped:
          type: boolean
      required: [taskId, stopped]
    AvatarVideoTask:
      type: object
      properties:
        taskId:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, stopped, unknown]
        progress:
          type: number
          minimum: 0
          maximum: 1
        step:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
      required: [taskId, status, progress, step, error, videoUrl]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

